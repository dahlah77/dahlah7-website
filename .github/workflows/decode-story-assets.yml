name: Decode Instagram Story Assets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  decode:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[ASSET]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode story assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p story-assets
          shopt -s nullglob
          files=(story-seeds/*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No seed files found."
            exit 1
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f" .b64)"
            base64 --decode "$f" > "story-assets/$name.jpg"
          done
          rm -rf story-seeds

      - name: Commit decoded assets
        shell: bash
        run: |
          git config user.name "DAHLAH7 Story Bot"
          git config user.email "actions@users.noreply.github.com"
          git add story-assets story-seeds 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Instagram story assets"
            git push
          fi

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Story assets decoded and published.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
