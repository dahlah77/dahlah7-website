name: Import Instagram Story Assets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  import:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[STORY-ASSET]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow requests

      - name: Import and convert story assets
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import requests
          from PIL import Image, ImageFilter, ImageOps

          payload = json.loads(os.environ["ISSUE_BODY"])
          items = payload.get("items", [])
          if not items:
              raise SystemExit("No items provided")

          outdir = Path("public/instagram-stories/2026-10")
          outdir.mkdir(parents=True, exist_ok=True)

          for item in items:
              url = item["url"]
              name = item["name"]
              if not name.lower().endswith(".jpg"):
                  raise ValueError(f"Destination must be .jpg: {name}")
              r = requests.get(url, timeout=60)
              r.raise_for_status()
              im = Image.open(io.BytesIO(r.content)).convert("RGB")

              bg = ImageOps.fit(im, (1080, 1920), method=Image.Resampling.LANCZOS)
              bg = bg.filter(ImageFilter.GaussianBlur(28))
              black = Image.new("RGB", bg.size, (0, 0, 0))
              bg = Image.blend(bg, black, 0.35)

              fg = ImageOps.contain(im, (1080, 1080), method=Image.Resampling.LANCZOS)
              bg.paste(fg, ((1080 - fg.width)//2, (1920 - fg.height)//2))

              bg.save(outdir / name, "JPEG", quality=88, optimize=True, progressive=True)
          PY

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAHLAH7 Story Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/instagram-stories/2026-10
          if ! git diff --cached --quiet; then
            git commit -m "chore: add Instagram Story queue assets"
            git push
          fi

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Story assets imported and converted to 1080×1920 JPEG.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
